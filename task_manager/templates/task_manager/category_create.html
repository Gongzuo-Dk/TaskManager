{% extends "base.html" %}

{% block content %}
<h2>Create Category</h2>

{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create Category</button>
</form>

<a href="{% url 'index' %}">Cancel</a>
{% endblock %}
