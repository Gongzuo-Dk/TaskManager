{% extends 'base.html' %}
{% load static %}

{% block content %}
<h2>Delete Task</h2>

<p>Are you sure you want to delete "{{ task.title }}"?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, delete it</button>
</form>

<a href="{% url 'index' %}">Cancel</a>
{% endblock %}
